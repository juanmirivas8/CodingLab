<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TypeScript Lab</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
            padding: 40px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .section {
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        
        .section h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 18px;
        }
        
        input, button {
            padding: 10px 15px;
            font-size: 14px;
            border: 1px solid #ddd;
            border-radius: 5px;
            margin-right: 10px;
        }
        
        button {
            background: #667eea;
            color: white;
            cursor: pointer;
            border: none;
            transition: background 0.3s;
        }
        
        button:hover {
            background: #764ba2;
        }
        
        .output {
            background: white;
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 15px;
            margin-top: 15px;
            font-family: 'Courier New', monospace;
            color: #333;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .log-entry {
            padding: 5px 0;
            border-bottom: 1px solid #eee;
        }
        
        .log-entry:last-child {
            border-bottom: none;
        }
        
        .success {
            color: #28a745;
        }
        
        .error {
            color: #dc3545;
        }
        
        .info {
            color: #667eea;
        }
        
        .tic-tac-toe-board {
            display: grid;
            grid-template-columns: repeat(3, 80px);
            grid-gap: 5px;
            margin: 0 auto 20px;
            width: fit-content;
        }
        
        .cell {
            width: 80px;
            height: 80px;
            font-size: 32px;
            font-weight: bold;
            border: 2px solid #667eea;
            background: white;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.2s;
            color: #667eea;
        }
        
        .cell:hover {
            background: #f0f0f0;
            transform: scale(1.05);
        }
        
        .cell:disabled {
            cursor: not-allowed;
            opacity: 0.8;
        }
        
        .cell.x {
            color: #667eea;
        }
        
        .cell.o {
            color: #764ba2;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 TypeScript Lab</h1>
        <p class="subtitle">Espacio para aprender y probar TypeScript</p>
        
        <!-- Calculadora Simple -->
        <div class="section">
            <h2>Calculadora Simple</h2>
            <div>
                <input type="number" id="num1" placeholder="Número 1">
                <input type="number" id="num2" placeholder="Número 2">
                <button onclick="calculateSum()">Sumar</button>
                <button onclick="calculateMultiply()">Multiplicar</button>
            </div>
            <div id="calcOutput" class="output"></div>
        </div>
        
        <!-- Texto a Mayúsculas -->
        <div class="section">
            <h2>Transformador de Texto</h2>
            <div>
                <input type="text" id="textInput" placeholder="Ingresa un texto">
                <button onclick="transformText()">Convertir a Mayúsculas</button>
            </div>
            <div id="textOutput" class="output"></div>
        </div>
        
        <!-- Validador de Email -->
        <div class="section">
            <h2>Validador de Email</h2>
            <div>
                <input type="email" id="emailInput" placeholder="Ingresa un email">
                <button onclick="validateEmail()">Validar</button>
            </div>
            <div id="emailOutput" class="output"></div>
        </div>
        
        <!-- Contador -->
        <div class="section">
            <h2>Contador</h2>
            <div>
                <button onclick="increment()">+</button>
                <span id="counterDisplay" style="font-size: 24px; margin: 0 15px; color: #667eea; font-weight: bold;">0</span>
                <button onclick="decrement()">-</button>
                <button onclick="resetCounter()" style="margin-left: 20px;">Reset</button>
            </div>
            <div id="counterOutput" class="output"></div>
        </div>
        
        <!-- Juego 3 en Raya -->
        <div class="section">
            <h2>🎮 Tres en Raya</h2>
            <div style="text-align: center;">
                <div id="gameStatus" style="font-size: 18px; color: #667eea; margin-bottom: 15px; font-weight: bold;">
                    Turno: <span id="currentPlayer">X</span>
                </div>
                <div id="board" class="tic-tac-toe-board">
                    <button class="cell" onclick="playMove(0)"></button>
                    <button class="cell" onclick="playMove(1)"></button>
                    <button class="cell" onclick="playMove(2)"></button>
                    <button class="cell" onclick="playMove(3)"></button>
                    <button class="cell" onclick="playMove(4)"></button>
                    <button class="cell" onclick="playMove(5)"></button>
                    <button class="cell" onclick="playMove(6)"></button>
                    <button class="cell" onclick="playMove(7)"></button>
                    <button class="cell" onclick="playMove(8)"></button>
                </div>
                <button onclick="resetGame()" style="margin-top: 15px; padding: 12px 30px; font-size: 16px;">Nuevo Juego</button>
                <div id="gameOutput" class="output" style="margin-top: 15px;"></div>
            </div>
        </div>
        
        <!-- Consola para ver logs -->
        <div class="section">
            <h2>Consola de Salida</h2>
            <div id="console" class="output" style="min-height: 200px;">
                <div class="log-entry info">Sistema listo. Abre la consola del navegador (F12) para ver más detalles.</div>
            </div>
        </div>
    </div>
    
    <script src="dist/app.js"></script>
</body>
</html>
