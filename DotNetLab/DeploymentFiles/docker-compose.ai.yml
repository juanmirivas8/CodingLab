services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_ORIGINS=*
    volumes:
      - ollama_data:/root/.ollama
    devices:
      - "nvidia.com/gpu=all"
    restart: unless-stopped
    networks:
      - dotnetlab-network

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - open-webui_data:/app/backend/data
    restart: unless-stopped
    depends_on:
      - ollama
    networks:
      - dotnetlab-network

volumes:
  ollama_data:
    driver: local
  open-webui_data:
    driver: local

networks:
  dotnetlab-network:
    driver: bridge

