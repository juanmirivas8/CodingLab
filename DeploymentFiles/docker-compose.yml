version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: dotnetlab-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong@Passw0rd
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    restart: unless-stopped
    networks:
      - dotnetlab-network

  api:
    image: dotnetlab-api:latest
    container_name: dotnetlab-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      - sqlserver
    networks:
      - dotnetlab-network

volumes:
  sqlserver_data:
    driver: local

networks:
  dotnetlab-network:
    driver: bridge
