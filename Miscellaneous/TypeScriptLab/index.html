<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TypeScript Lab</title>
    <link rel="stylesheet" href="src/Styles/main.css">
</head>
<body>
    <div class="container">
        <h1>📚 TypeScript Lab</h1>
        <p class="subtitle">Espacio para aprender y probar TypeScript</p>

        <!-- Text playground -->
        <div class="section">
            <h2>Text playground</h2>
            <div>
                <input type="text" id="textPlaygroundInput" placeholder="Ingresa un texto">
                <select id="textPlaygroundDropdown">
                    <!-- Options will be populated dynamically from TypeScript -->
                </select>
                <button id = "textPlaygroundButton" >Go !</button>
            </div>
            <div id="textPlayGroundOutput" class="output"></div>
        </div>
        
        <!-- Consola para ver logs -->
        <div class="section">
            <h2>Consola de Salida</h2>
            <div id="console" class="output console-output">
                <div class="log-entry info">Sistema listo. Abre la consola del navegador (F12) para ver más detalles.</div>
            </div>
        </div>
    </div>
    
    <script type="module" src="/src/app.ts"></script>
</body>
</html>
