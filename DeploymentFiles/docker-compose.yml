version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: dotnetlab-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${SA_PASSWORD}
      - MSSQL_PID=${MSSQL_PID}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    restart: unless-stopped
    networks:
      - dotnetlab-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: dotnetlab-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
    ports:
      - "5672:5672"   # AMQP protocol port
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped
    networks:
      - dotnetlab-network

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: dotnetlab-azurite
    hostname: azurite
    command: "azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --loose"
    ports:
      - "10000:10000" # Blob service
      - "10001:10001" # Queue service
      - "10002:10002" # Table service
    volumes:
      - azurite_data:/data
    restart: unless-stopped
    networks:
      - dotnetlab-network

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13
    container_name: aspire-dashboard
    ports:
      - "18888:18888"  # Dashboard UI
      - "18889:18889"  # OTLP gRPC endpoint
    environment:
      - DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS=true
      - ASPNETCORE_URLS=http://+:18888
      - DOTNET_DASHBOARD_OTLP_ENDPOINT_URL=http://+:18889
      - DOTNET_DASHBOARD_OTLP_HTTP_ENDPOINT_URL=http://+:18890
    restart: unless-stopped
    networks:
      - dotnetlab-network

  api:
    image: dotnetlab-api:latest
    container_name: dotnetlab-api
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ConnectionStrings__DefaultConnection=${ConnectionStrings__DefaultConnection}
      - RabbitMq__UserName=${RabbitMq__UserName}
      - RabbitMq__Password=${RabbitMq__Password}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://aspire-dashboard:18889
      - OTEL_EXPORTER_OTPL_PROTOCOL=grpc
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      - sqlserver
      - rabbitmq
    networks:
      - dotnetlab-network
        
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_ORIGINS=*
    volumes:
      - ollama_data:/root/.ollama
    devices:
      - "nvidia.com/gpu=all"
    restart: unless-stopped
    networks:
      - dotnetlab-network
  
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - open-webui_data:/app/backend/data
    networks:
      - dotnetlab-network
    depends_on:
      - ollama

volumes:
  sqlserver_data:
    driver: local
  rabbitmq_data:
    driver: local
  azurite_data:
    driver: local
  ollama_data:
    driver: local
  open-webui_data:
    driver: local

networks:
  dotnetlab-network:
    driver: bridge
